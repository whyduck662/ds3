<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Arial, sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#375b7c"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="600" y="35" font-size="24" fill="#17324d" text-anchor="middle">Hình 3.2 — Matching durable worker và recovery</text><rect x="55" y="90" width="285" height="75" rx="12" fill="#eaf2fa" stroke="#8aa6c1"/><text x="197.5" y="118" font-size="19" fill="#17324d" text-anchor="middle">PENDING</text><text x="197.5" y="144" font-size="14" fill="#17324d" text-anchor="middle">Inbox + work item COMMIT</text><path d="M 340 125 L 425 125" fill="none" stroke="#375b7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="430" y="90" width="300" height="75" rx="12" fill="#eaf2fa" stroke="#8aa6c1"/><text x="580" y="118" font-size="19" fill="#17324d" text-anchor="middle">RUNNING / claim</text><text x="580" y="144" font-size="14" fill="#17324d" text-anchor="middle">Lease + claim_token COMMIT</text><path d="M 730 125 L 815 125" fill="none" stroke="#375b7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="820" y="90" width="315" height="75" rx="12" fill="#eaf2fa" stroke="#8aa6c1"/><text x="977.5" y="118" font-size="19" fill="#17324d" text-anchor="middle">RESERVING</text><text x="977.5" y="144" font-size="14" fill="#17324d" text-anchor="middle">Candidate + reservationId COMMIT</text><path d="M 975 165 L 975 270" fill="none" stroke="#375b7c" stroke-width="2" marker-end="url(#arrow)"/><text x="975" y="208.5" font-size="14" fill="#17324d" text-anchor="middle">REST reserve</text><rect x="815" y="275" width="320" height="75" rx="12" fill="#e2f3e9" stroke="#8aa6c1"/><text x="975" y="303" font-size="19" fill="#17324d" text-anchor="middle">RESERVED + reply</text><text x="975" y="329" font-size="14" fill="#17324d" text-anchor="middle">Transaction outbox COMMIT</text><rect x="55" y="275" width="360" height="75" rx="12" fill="#fff1d9" stroke="#8aa6c1"/><text x="235" y="303" font-size="19" fill="#17324d" text-anchor="middle">CANCEL_REQUESTED</text><text x="235" y="329" font-size="14" fill="#17324d" text-anchor="middle">Tombstone bền vững</text><path d="M 415 312 L 505 312" fill="none" stroke="#375b7c" stroke-width="2" marker-end="url(#arrow)"/><text x="460" y="303" font-size="14" fill="#17324d" text-anchor="middle">release / đối soát</text><rect x="510" y="275" width="285" height="75" rx="12" fill="#e2f3e9" stroke="#8aa6c1"/><text x="652.5" y="303" font-size="19" fill="#17324d" text-anchor="middle">CANCELLED + ACK</text><text x="652.5" y="329" font-size="14" fill="#17324d" text-anchor="middle">Chỉ sau release xác nhận</text><text x="600" y="425" font-size="19" fill="#17324d" text-anchor="middle">Crash: worker mới đọc DB, claim lại lease hết hạn và dùng cùng reservationId.</text><text x="600" y="465" font-size="19" fill="#17324d" text-anchor="middle">Timeout/503: giữ trạng thái; retry sau 2 giây. Không ACK hủy trên lỗi mạng.</text></svg>