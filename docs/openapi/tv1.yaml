openapi: 3.0.3
info:
  title: DS03 TV1 — Identity, Gateway, Notification
  version: 1.0.0
  description: API đã triển khai của TV1. API Trip/Driver/Payment bàn giao ở docs/contracts.md.
servers:
  - url: http://localhost:8080
paths:
  /auth/register:
    post:
      summary: Đăng ký Passenger hoặc Driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Credentials'
                - type: object
                  required: [name, role]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 100}
                    role: {type: string, enum: [PASSENGER, DRIVER]}
      responses:
        '201':
          description: Tạo user thành công; không trả hash/password
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      summary: Đăng nhập, JWT 15 phút
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200':
          description: JWT và tài khoản
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, user]
                properties:
                  accessToken: {type: string}
                  expiresIn: {type: integer, example: 900}
                  user:
                    type: object
                    properties:
                      userId: {type: string, format: uuid}
                      name: {type: string}
                      role: {type: string, enum: [PASSENGER, DRIVER, ADMIN]}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /users/me:
    get:
      security: [{bearerAuth: []}]
      summary: Tài khoản của chủ JWT
      responses:
        '200':
          description: Tài khoản hiện tại
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /notifications/me:
    get:
      security: [{bearerAuth: []}]
      summary: Tối đa 200 thông báo mới nhất của chủ JWT
      parameters:
        - in: query
          name: since
          schema: {type: string, format: date-time}
          description: Lọc createdAt lớn hơn since; ISO UTC, ví dụ 2026-11-10T08:00:00.000Z
      responses:
        '200':
          description: Chỉ dữ liệu userId trong JWT, mới nhất trước
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        eventId: {type: string, format: uuid}
                        tripId: {type: string, format: uuid}
                        type: {type: string}
                        aggregateVersion: {type: integer}
                        correlationId: {type: string, format: uuid}
                        createdAt: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 8, maxLength: 72, description: Tối đa 72 byte UTF-8}
    User:
      type: object
      properties:
        userId: {type: string, format: uuid}
        email: {type: string, format: email}
        name: {type: string}
        role: {type: string, enum: [PASSENGER, DRIVER, ADMIN]}
    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code: {type: string}
        message: {type: string}
        correlationId: {type: string, format: uuid}
  responses:
    Error:
      description: Lỗi thống nhất; Gateway còn có thể trả 413, 429 hoặc 503
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
