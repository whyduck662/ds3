name: TV1 checks
on: [push, pull_request]
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: docker compose -f deploy/compose.test.yaml up -d --wait
      - run: npm run test:integration
      - if: always()
        run: mkdir -p artifacts && docker compose -f deploy/compose.test.yaml logs --no-color > artifacts/integration-containers.log
      - if: always()
        run: docker compose -f deploy/compose.test.yaml down --volumes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv1-evidence
          path: artifacts/
