  matching-service-2:
    <<: *app
    environment:
      SERVICE_NAME: matching-service
      INSTANCE_ID: matching-service-2
      PORT: 8084
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://matching:${MATCHING_DB_PASSWORD}@matching-db:5432/matching
