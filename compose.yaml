name: ds03
x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  networks: [backend]
  mem_limit: 256m
  healthcheck:
    test: [CMD, node, -e, "fetch('http://localhost:'+process.env.PORT+'/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 4s
    retries: 10
    start_period: 20s
services:
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ride
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/init-env.ps1}
    ports: ["127.0.0.1:15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    networks: [backend]
    mem_limit: 512m
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  identity-db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run scripts/init-env.ps1}
    volumes: ["identity-data:/var/lib/postgresql/data"]
    networks: [backend]
    mem_limit: 192m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 3s
      retries: 20
  identity-service:
    <<: *app
    environment:
      SERVICE_NAME: identity-service
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:?Run scripts/init-env.ps1}
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD}@identity-db:5432/identity
      RABBITMQ_URL: amqp://ride:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      identity-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  driver-db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: driver
      POSTGRES_USER: driver
      POSTGRES_PASSWORD: ${DRIVER_DB_PASSWORD:?Run scripts/init-env.ps1}
    volumes: ["driver-data:/var/lib/postgresql/data"]
    networks: [backend]
    mem_limit: 192m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U driver -d driver"]
      interval: 5s
      timeout: 3s
      retries: 20
  driver-service:
    <<: *app
    environment:
      SERVICE_NAME: driver-service
      PORT: 8082
      JWT_SECRET: ${JWT_SECRET:?Run scripts/init-env.ps1}
      DATABASE_URL: postgres://driver:${DRIVER_DB_PASSWORD}@driver-db:5432/driver
      RABBITMQ_URL: amqp://ride:${RABBITMQ_PASSWORD}@rabbitmq:5672
